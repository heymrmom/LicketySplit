appId: com.heymrmom.licketysplit.desktop
productName: LicketySplit
# Predictable, space-free, arch-suffixed candidate artifact names.
artifactName: ${productName}-${version}-${arch}.${ext}
asar: true
# The MCP stdio shim must be a real on-disk file so external clients (Claude
# Desktop / Cursor / Cline) can spawn it with `node`; unpack it from the asar.
asarUnpack:
  - dist/mcp-shim/**
directories:
  output: release
# No update provider is configured for this candidate.
publish: null
files:
  - dist/**/*
  - "!**/*.map"
  - package.json
extraResources:
  - from: resources/BUILD_SOURCE.json
    to: BUILD_SOURCE.json
  - from: ../web/dist
    to: renderer
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/native-inspector
    to: native-inspector
    filter:
      - "**/*"
  - from: resources/rigging
    to: rigging
    filter:
      - "**/*"
  - from: resources/aurora
    to: aurora
    filter:
      - "**/*"
  - from: LICENSES
    to: LICENSES
    filter:
      - "**/*"
mac:
  category: public.app-category.video
  icon: build/licketysplit.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: "14.0"
  identity: null

win:
  icon: ../web/public/icons/licketysplit-mark.png
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: ../web/public/icons/licketysplit-mark.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
