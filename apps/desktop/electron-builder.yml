appId: com.heymrmom.licketysplit.desktop
productName: LicketySplit
# Predictable, space-free, arch-suffixed names → clean R2 URLs + a simple
# manifest (e.g. OpenReel-1.2.3-arm64.dmg, OpenReel-1.2.3-x64.exe).
artifactName: ${productName}-${version}-${arch}.${ext}
asar: true
# The MCP stdio shim must be a real on-disk file so external clients (Claude
# Desktop / Cursor / Cline) can spawn it with `node`; unpack it from the asar.
asarUnpack:
  - dist/mcp-shim/**
directories:
  output: release
# Update feed for electron-updater. Builds embed app-update.yml pointing at the
# R2-backed download subdomain and generate latest*.yml + blockmaps; the release
# CI uploads everything to R2 (the generic provider does not upload itself).
publish: null
files:
  - dist/**/*
  - "!**/*.map"
  - package.json
extraResources:
  - from: resources/BUILD_SOURCE.json
    to: BUILD_SOURCE.json
  - from: ../web/dist
    to: renderer
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/native-inspector
    to: native-inspector
    filter:
      - "**/*"
  - from: resources/rigging
    to: rigging
    filter:
      - "**/*"
  - from: resources/aurora
    to: aurora
    filter:
      - "**/*"
  - from: LICENSES
    to: LICENSES
    filter:
      - "**/*"
mac:
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: "14.0"
  identity: null

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
