name: Legacy release (disabled)

# The inherited upstream release and R2 upload automation is intentionally
# disabled for this fork. Candidate builds are manual and gated separately.
on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled workflow
        run: |
          echo "::error::Publishing is disabled. Use the manually gated LicketySplit desktop candidate workflow only after its acceptance gates are met."
          exit 1
